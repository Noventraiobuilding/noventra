<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sərmayə Platforması</title>
    <!-- Supabase JS Client library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: var(--text-color);
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.danger {
            background-color: var(--danger-color);
        }

        button.danger:hover {
            background-color: #dc2626;
        }

        .switch-auth {
            text-align: center;
            margin-top: 14px;
            font-size: 0.9rem;
        }

        .switch-auth a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .profile-info {
            margin-bottom: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .badge {
            background-color: #e0e7ff;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background-color: #dcfce7;
            color: #166534;
        }

        .hidden {
            display: none !important;
        }

        .admin-section {
            border-top: 2px dashed var(--border-color);
            margin-top: 20px;
            padding-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="alertBox" class="alert"></div>

    <!-- REGISTER CARD -->
    <div id="registerCard" class="card">
        <h2>Qeydiyyat</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="regEmail">E-poçt</label>
                <input type="email" id="regEmail" required placeholder="nümunə@mail.com">
            </div>
            <div class="form-group">
                <label for="regPassword">Şifrə</label>
                <input type="password" id="regPassword" required placeholder="******">
            </div>
            <div class="form-group">
                <label for="regRef">Referal Kodu (İstəyə bağlı)</label>
                <input type="text" id="regRef" placeholder="Məsələn: REF1234">
            </div>
            <button type="submit" id="regBtn">Qeydiyyatdan Keç</button>
        </form>
        <div class="switch-auth">
            Hesabınız var? <a href="#" id="toLogin">Daxil olun</a>
        </div>
    </div>

    <!-- LOGIN CARD -->
    <div id="loginCard" class="card hidden">
        <h2>Daxil Ol</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">E-poçt</label>
                <input type="email" id="loginEmail" required placeholder="nümunə@mail.com">
            </div>
            <div class="form-group">
                <label for="loginPassword">Şifrə</label>
                <input type="password" id="loginPassword" required placeholder="******">
            </div>
            <button type="submit" id="loginBtn">Daxil Ol</button>
        </form>
        <div class="switch-auth">
            Hesabınız yoxdur? <a href="#" id="toRegister">Qeydiyyatdan keçin</a>
        </div>
    </div>

    <!-- DASHBOARD CARD -->
    <div id="dashboardCard" class="card hidden">
        <h2>Şəxsi Kabinet</h2>
        <div class="profile-info">
            <div class="info-row">
                <span>E-poçt:</span>
                <strong id="userEmail">-</strong>
            </div>
            <div class="info-row">
                <span>Balans:</span>
                <strong><span id="userBalance">0.00</span> AZN</strong>
            </div>
            <div class="info-row">
                <span>VIP Səviyyə:</span>
                <span class="badge" id="userVip">VIP 0</span>
            </div>
            <div class="info-row">
                <span>Referal Kodunuz:</span>
                <strong id="userRefCode">-</strong>
            </div>
            <div class="info-row">
                <span>Status:</span>
                <span id="userAdminStatus" class="badge">İstifadəçi</span>
            </div>
        </div>

        <div class="form-group">
            <label for="depositAmount">Balansı Artır (AZN)</label>
            <input type="number" id="depositAmount" min="1" placeholder="Məbləğ daxil edin">
        </div>
        <button id="depositBtn" style="margin-bottom: 12px;">Balansı Yenilə</button>

        <!-- ADMIN PANEL SECTION -->
        <div id="adminSection" class="admin-section hidden">
            <h3 style="text-align: center; margin-top:0;">Admin Panel</h3>
            <div class="form-group">
                <label for="targetUserEmail">Hədəf İstifadəçi E-poçtu</label>
                <input type="email" id="targetUserEmail" placeholder="istifadeci@mail.com">
            </div>
            <div class="form-group">
                <label for="adminSetBalance">Yeni Balans</label>
                <input type="number" id="adminSetBalance" placeholder="50.00">
            </div>
            <button id="adminUpdateBtn" style="margin-bottom: 10px;">İstifadəçi Balansını Dəyiş</button>
            <button id="adminBlockBtn" class="danger">İstifadəçini Blokla / Blokdan Çıxar</button>
        </div>

        <button id="logoutBtn" class="danger" style="margin-top: 20px;">Çıxış Et</button>
    </div>
</div>

<script>
    // 1. Supabase Initialization
    const SUPABASE_URL = "https://yafncpfkjmealuwmvcgc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4uogckOVNwIrH72gbNlSxg_ywvZ1BE1";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Global State
    let currentUser = null;
    let currentProfile = null;

    // DOM Elements
    const registerCard = document.getElementById('registerCard');
    const loginCard = document.getElementById('loginCard');
    const dashboardCard = document.getElementById('dashboardCard');
    
    const registerForm = document.getElementById('registerForm');
    const loginForm = document.getElementById('loginForm');
    
    const alertBox = document.getElementById('alertBox');
    const toLogin = document.getElementById('toLogin');
    const toRegister = document.getElementById('toRegister');
    const logoutBtn = document.getElementById('logoutBtn');

    const userEmailEl = document.getElementById('userEmail');
    const userBalanceEl = document.getElementById('userBalance');
    const userVipEl = document.getElementById('userVip');
    const userRefCodeEl = document.getElementById('userRefCode');
    const userAdminStatusEl = document.getElementById('userAdminStatus');
    
    const depositAmountInput = document.getElementById('depositAmount');
    const depositBtn = document.getElementById('depositBtn');
    
    const adminSection = document.getElementById('adminSection');
    const targetUserEmailInput = document.getElementById('targetUserEmail');
    const adminSetBalanceInput = document.getElementById('adminSetBalance');
    const adminUpdateBtn = document.getElementById('adminUpdateBtn');
    const adminBlockBtn = document.getElementById('adminBlockBtn');

    // Helper: Show Alert
    function showAlert(message, type = 'danger') {
        alertBox.textContent = message;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = 'block';
        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 5000);
    }

    // Helper: Generate Random Referral Code
    function generateRefCode() {
        return 'REF' + Math.floor(100000 + Math.random() * 900000);
    }

    // Switch Views
    toLogin.addEventListener('click', (e) => {
        e.preventDefault();
        registerCard.classList.add('hidden');
        loginCard.classList.remove('hidden');
    });

    toRegister.addEventListener('click', (e) => {
        e.preventDefault();
        loginCard.classList.add('hidden');
        registerCard.classList.remove('hidden');
    });

    // 4 & 5. Fetch and Sync Profile with Supabase
    async function loadProfile(user) {
        try {
            let { data: profile, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .maybeSingle();

            if (error) throw error;

            // Əgər profil yoxdursa, yeni yaradılır (Upsert)
            if (!profile) {
                const newProfile = {
                    id: user.id,
                    email: user.email,
                    balance: 0.00,
                    vip_level: 0,
                    referral_code: generateRefCode(),
                    is_admin: false,
                    is_blocked: false
                };
                
                const { data: createdProfile, error: createError } = await supabase
                    .from('profiles')
                    .upsert(newProfile)
                    .select()
                    .single();

                if (createError) throw createError;
                profile = createdProfile;
            }

            if (profile.is_blocked) {
                showAlert('Hesabınız bloklanıb! Sistemə daxil ola bilməzsiniz.');
                await supabase.auth.signOut();
                return;
            }

            currentUser = user;
            currentProfile = profile;
            renderDashboard();
        } catch (err) {
            console.error('Profil yüklənmə xətası:', err);
            showAlert('Profil məlumatları yüklənərkən xəta baş verdi: ' + err.message);
        }
    }

    // Render Dashboard Info
    function renderDashboard() {
        if (!currentProfile) return;

        registerCard.classList.add('hidden');
        loginCard.classList.add('hidden');
        dashboardCard.classList.remove('hidden');

        userEmailEl.textContent = currentProfile.email || currentUser.email;
        userBalanceEl.textContent = Number(currentProfile.balance || 0).toFixed(2);
        userVipEl.textContent = `VIP ${currentProfile.vip_level || 0}`;
        userRefCodeEl.textContent = currentProfile.referral_code || '-';
        
        if (currentProfile.is_admin) {
            userAdminStatusEl.textContent = "Admin";
            userAdminStatusEl.style.backgroundColor = "#fef3c7";
            userAdminStatusEl.style.color = "#d97706";
            adminSection.classList.remove('hidden');
        } else {
            userAdminStatusEl.textContent = "İstifadəçi";
            userAdminStatusEl.style.backgroundColor = "#e0e7ff";
            userAdminStatusEl.style.color = "#2563eb";
            adminSection.classList.add('hidden');
        }
    }

    // 5. Save/Update Profile Helper
    async function saveProfile(updates) {
        if (!currentUser) return null;
        try {
            const { data, error } = await supabase
                .from('profiles')
                .update(updates)
                .eq('id', currentUser.id)
                .select()
                .single();

            if (error) throw error;
            currentProfile = data;
            renderDashboard();
            return data;
        } catch (err) {
            console.error('Profil yeniləmə xətası:', err);
            showAlert('Dəyişikliklər saxlanılarkən xəta baş verdi: ' + err.message);
            return null;
        }
    }

    // 3. Register Functionality
    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        try {
            const { data, error } = await supabase.auth.signUp({
                email,
                password
            });

            if (error) throw error;

            if (data.user) {
                showAlert('Qeydiyyat uğurla tamamlandı!', 'success');
                // İlk profili yaradırıq
                const { error: profileError } = await supabase
                    .from('profiles')
                    .upsert({
                        id: data.user.id,
                        email: data.user.email,
                        balance: 0.00,
                        vip_level: 0,
                        referral_code: generateRefCode(),
                        is_admin: false,
                        is_blocked: false
                    });

                if (profileError) console.error("Initial profile setup warning:", profileError);

                if (data.session) {
                    await loadProfile(data.user);
                } else {
                    showAlert('Təsdiq linki e-poçt ünvanınıza göndərildi. Zəhmət olmasa e-poçtunuzu yoxlayın.', 'success');
                    registerCard.classList.add('hidden');
                    loginCard.classList.remove('hidden');
                }
            }
        } catch (err) {
            showAlert(err.message);
        }
    });

    // 3. Login Functionality
    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) throw error;

            if (data.user) {
                await loadProfile(data.user);
            }
        } catch (err) {
            showAlert('Giriş xətası: ' + err.message);
        }
    });

    // 3. Logout Functionality
    logoutBtn.addEventListener('click', async () => {
        try {
            await supabase.auth.signOut();
            currentUser = null;
            currentProfile = null;
            dashboardCard.classList.add('hidden');
            loginCard.classList.remove('hidden');
            showAlert('Uğurla çıxış edildı.', 'success');
        } catch (err) {
            showAlert('Çıxış edərkən xəta baş verdi: ' + err.message);
        }
    });

    // Balance Increase Action
    depositBtn.addEventListener('click', async () => {
        const amount = parseFloat(depositAmountInput.value);
        if (isNaN(amount) || amount <= 0) {
            showAlert('Düzgün məbləğ daxil edin');
            return;
        }

        const newBalance = Number(currentProfile.balance || 0) + amount;
        const res = await saveProfile({ balance: newBalance });
        if (res) {
            depositAmountInput.value = '';
            showAlert('Balans uğurla artırıldı!', 'success');
        }
    });

    // Admin Action: Update User Balance
    adminUpdateBtn.addEventListener('click', async () => {
        const targetEmail = targetUserEmailInput.value.trim();
        const newBal = parseFloat(adminSetBalanceInput.value);

        if (!targetEmail || isNaN(newBal)) {
            showAlert('E-poçt və yeni balansı düzgün daxil edin');
            return;
        }

        try {
            const { data, error } = await supabase
                .from('profiles')
                .update({ balance: newBal })
                .eq('email', targetEmail)
                .select();

            if (error) throw error;

            if (data && data.length > 0) {
                showAlert(`${targetEmail} üçün balans ${newBal} AZN olaraq yeniləndi`, 'success');
                adminSetBalanceInput.value = '';
                if (targetEmail === currentProfile.email) {
                    await loadProfile(currentUser);
                }
            } else {
                showAlert('İstifadəçi tapılmadı');
            }
        } catch (err) {
            showAlert('Xəta: ' + err.message);
        }
    });

    // Admin Action: Block/Unblock User
    adminBlockBtn.addEventListener('click', async () => {
        const targetEmail = targetUserEmailInput.value.trim();

        if (!targetEmail) {
            showAlert('Hədəf istifadəçi e-poçtunu daxil edin');
            return;
        }

        try {
            // Əvvəl mövcud statusunu oxuyuruq
            const { data: targetProfile, error: fetchErr } = await supabase
                .from('profiles')
                .select('is_blocked')
                .eq('email', targetEmail)
                .single();

            if (fetchErr || !targetProfile) {
                showAlert('İstifadəçi tapılmadı');
                return;
            }

            const newBlockState = !targetProfile.is_blocked;

            const { error: updateErr } = await supabase
                .from('profiles')
                .update({ is_blocked: newBlockState })
                .eq('email', targetEmail);

            if (updateErr) throw updateErr;

            showAlert(`${targetEmail} ${newBlockState ? 'bloklandı' : 'blokdan çıxarıldı'}`, 'success');
        } catch (err) {
            showAlert('Xəta: ' + err.message);
        }
    });

    // Initialize & Handle Auth State Change
    window.addEventListener('DOMContentLoaded', async () => {
        // Mövcud sessiyanı yoxlayırıq
        const { data: { session } } = await supabase.auth.getSession();
        
        if (session && session.user) {
            await loadProfile(session.user);
        } else {
            loginCard.classList.remove('hidden');
        }

        // Sessiyanın canlı izlənməsi
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' && session) {
                await loadProfile(session.user);
            } else if (event === 'SIGNED_OUT') {
                currentUser = null;
                currentProfile = null;
                dashboardCard.classList.add('hidden');
                registerCard.classList.add('hidden');
                loginCard.classList.remove('hidden');
            }
        });
    });
</script>

</body>
</html>
