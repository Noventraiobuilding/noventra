function page(name){  
  ["homePage", "vipPage", "accountPage", "adminPage"].forEach(x => {  
    const el = document.getElementById(x);  
    if(el) el.classList.add("hidden");  
  });  
  
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));  
  
  let id = {  
    home: "homePage",  
    vip: "vipPage",  
    account: "accountPage",  
    admin: "adminPage"  
  }[name];  
  
  const target = document.getElementById(id);  
  if(target) target.classList.remove("hidden");  
  
  const navBtn = document.getElementById("nav-" + name);  
  if(navBtn) navBtn.classList.add("active");  
  
  if(name === "vip") renderVip();  
  if(name === "admin" && user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){  
    loadAdminData();  
  }  
}  
  
function showRegister(){  
  document.getElementById("loginPage").classList.add("hidden");  
  document.getElementById("registerPage").classList.remove("hidden");  
}  
  
function showLogin(){  
  document.getElementById("registerPage").classList.add("hidden");  
  document.getElementById("loginPage").classList.remove("hidden");  
}  
  
function renderVip(){  
  const box = document.getElementById("vipArea");  
  if(!box) return;  
  
  box.innerHTML = VIP_LIST.map(v => {  
    return `  
      <div class="card vip-card ${v.locked ? 'locked-card' : ''}">  
        <div class="vip-title">  
          ${v.name} ${v.locked ? "🔒" : ""}  
        </div>  
        <div class="info">  
          Qiymət: <b>${v.locked ? "Kilidli" : v.price + " AZN"}</b><br>  
          Müddət: <b>${v.days ? v.days + " gün" : "-"}</b><br>  
          Gündəlik qazanc: <b>${v.reward} AZN</b><br>  
          Status: <b>${v.locked ? "Bağlı" : "Aktiv"}</b><br>  
          ${v.referrals ? "Referal tələb: " + v.referrals + " nəfər<br>" : ""}  
        </div>  
        ${!v.locked ? `<button class="main" style="margin-top:15px;" onclick="buyVip(${v.id}, ${v.price})">Yatırım Et (${v.price} AZN)</button>` : ''}

}  
  
async function register(){  
  const email = document.getElementById("regEmail").value.trim();  
  const password = document.getElementById("regPassword").value;  
  const referral = document.getElementById("regReferral").value.trim();  
  const msg = document.getElementById("regMsg");  
  
  if(!email || !password){  
    msg.innerText = "Email və şifrə daxil edin";  
    return;  
  }  
  
  const { data, error } = await supabaseClient.auth.signUp({  
    email,  
    password  
  });  
  
  if(error){  
    msg.innerText = error.message;  
    return;  
  }  
  
  if(data.user){  
    const refCodeGenerated = "NV" + Math.random().toString(36).substring(2,8).toUpperCase();  
    await supabaseClient  
      .from("profiles")  
      .insert({  
        id: data.user.id,  
        email: email,  
        balance: 0,  
        bonus: 0,  
        current_vip: "Yeni istifadəçi",  
        referral_code: refCodeGenerated,  
        referred_by: referral || null  
      });  
  }  
  
  msg.innerText = "Hesab yaradıldı. Giriş edilir...";  
  setTimeout(() => {  
    if(data.user) openApp(data.user);  
    else showLogin();  
  }, 1000);  
}  
  
async function login(){  
  const email = document.getElementById("loginEmail").value.trim();  
  const password = document.getElementById("loginPassword").value;  
  const msg = document.getElementById("loginMsg");  
  
  if(!email || !password){  
    msg.innerText = "Email və şifrə daxil edin";  
    return;  
  }  
  
  const { data, error } = await supabaseClient.auth.signInWithPassword({  
    email,  
    password  
  });  
  
  if(error){  
    msg.innerText = "Email və ya şifrə səhvdir";  
    return;  
  }  
  
  openApp(data.user);  
}  
  
async function openApp(u){  
  user = u;  
  
  document.getElementById("loginPage").classList.add("hidden");  
  document.getElementById("registerPage").classList.add("hidden");  
  document.getElementById("app").classList.remove("hidden");  
  
  document.getElementById("email").innerText = user.email;  
  
  const adminBtn = document.getElementById("adminBtn");  
  if(user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){

  await loadProfile();

async function loadProfile(){  
  const { data, error } = await supabaseClient  
    .from("profiles")  
    .select("*")  
    .eq("id", user.id)  
    .maybeSingle();  
  
  profile = data || {};  
  
  document.getElementById("balance").innerText = (profile.balance || 0).toFixed(2) + " AZN";  
  document.getElementById("bonus").innerText = (profile.bonus || 0).toFixed(2) + " AZN";  
  document.getElementById("status").innerText = profile.current_vip || "Yeni istifadəçi";  
  
  document.getElementById("refCode").innerText = profile.referral_code || "-";  
  document.getElementById("shareCode").innerText = profile.referral_code || "-";  
  document.getElementById("vipStatus").innerText = profile.current_vip || "Yoxdur";  
}  
  
async function copyReferral(){  
  const code = document.getElementById("refCode").innerText;  
  if(!code || code === "-") return;  
  await navigator.clipboard.writeText(code);  
  alert("Referal kod kopyalandı: " + code);  
}  
  
async function withdrawRequest(){  
  const amount = Number(document.getElementById("withdrawAmount").value || 0);  
  const method = document.getElementById("withdrawMethod").value;  
  const info = document.getElementById("withdrawInfo").value.trim();  
  const msg = document.getElementById("withdrawMsg");  
  
  if(amount < 8){  
    msg.innerText = "Minimum çıxarış 8 AZN olmalıdır";  
    return;  
  }  
  
  if((profile.balance || 0) < amount){  
    msg.innerText = "Balansınızda kifayət qədər vəsait yoxdur";  
    return;  
  }  
  
  if(!info){  
    msg.innerText = "Məlumat daxil edin";  
    return;  
  }  
  
  const { error } = await supabaseClient  
    .from("withdraw_requests")  
    .insert({  
      user_id: user.id,  
      amount: amount,  
      method: method,  
      account_info: info,  
      status: "pending"  
    });  
  
  if(error){  
    msg.innerText = error.message;  
    return;  
  }  
  
  msg.innerText = "Çıxarış sorğusu göndərildi!";  
  document.getElementById("withdrawAmount").value = "";  
  document.getElementById("withdrawInfo").value = "";  
}  
  
async function buyVip(vipId, price){  
  if(price < 25){  
    alert("Minimum yatırım məbləği 25 AZN-dir.");  
    return;  
  }  
  
  await loadProfile();  
  
  if((profile.balance || 0) < price){  
    alert(`Balansınızda kifayət qədər vəsait yoxdur! Lazım olan məbləğ: ${price} AZN, Sizin balansınız: ${(profile.balance || 0).toFixed(2)} AZN`);  
    return;  
  }  
  
  const newBalance = profile.balance - price;  
  
  const { error: balanceError } = await supabaseClient  
    .from("profiles")  
    .update({ balance: newBalance })  
    .eq("id", user.id);  
  
  if(balanceError){  
    alert("Balans yenilənərkən xəta baş verdi: " + balanceError.message);  
    return;  
  }  
  
  const { error: investError } = await supabaseClient  
    .from("investments")  
    .insert({  
      user_id: user.id,  
      vip_id: vipId,  
      amount: price,  
      status: "pending"  
    });  
  
  if(investError){  
    await supabaseClient  
      .from("profiles")  
      .update({ balance: profile.balance })  
      .eq("id", user.id);  
    alert("Yatırım yaradılarkən xəta baş verdi: " + investError.message);  
  } else {  
    alert(`Yatırım sorğunuz göndərildi! Balansınızdan ${price} AZN çıxıldı. Təsdiq üçün adminə yönləndirildi.`);  
    await loadProfile();  
  }  
}  
  
async function processDailyProfits(){  
  if(!user) return;  
  
  const { data: investments, error } = await supabaseClient  
    .from("investments")  
    .select("*")  
    .eq("user_id", user.id)  
    .eq("status", "approved");  
  
  if(error || !investments || investments.length === 0) return;  
  
  const now = new Date();  
  let totalAddedEarnings = 0;  
  
  for(let inv of investments){  
    const vip = VIP_LIST.find(v => v.id === inv.vip_id);  
    if(!vip) continue;  
  
    const baseDateStr = inv.approved_at || inv.created_at;  
    const approvalDate = baseDateStr ? new Date(baseDateStr) : now;  
    const expireDate = new Date(approvalDate.getTime() + (vip.days * 24 * 60 * 60 * 1000));  
  
    if(now > expireDate){  
      await supabaseClient.from("investments").update({ status: "expired" }).eq("id", inv.id);  
      continue;  
    }  
  
    const lastCalcStr = inv.last_profit_calc || baseDateStr;  
    const lastCalc = lastCalcStr ? new Date(lastCalcStr) : now;  
    const diffHours = (now - lastCalc) / (1000 * 60 * 60);  
  
    if(diffHours >= 24){  
      const daysEarned = Math.floor(diffHours / 24);  
      const earnedAmount = daysEarned * vip.reward;  
      totalAddedEarnings += earnedAmount;  
  
      const newLastCalc = new Date(lastCalc.getTime() + (daysEarned * 24 * 60 * 60 * 1000));  
        
      let updatePayload = { last_profit_calc: newLastCalc.toISOString() };  
      let { error: updateErr } = await supabaseClient  
        .from("investments")  
        .update(updatePayload)  
        .eq("id", inv.id);  
  
      if(updateErr){  
        delete updatePayload.last_profit_calc;  
        updatePayload.updated_at = newLastCalc.toISOString();  
        await supabaseClient  
          .from("investments")  
          .update(updatePayload)  
          .eq("id", inv.id);  
      }  
    }  
  }  
  
  if(totalAddedEarnings > 0){  
    const newBalance = (profile.balance || 0) + totalAddedEarnings;  
    await supabaseClient  
      .from("profiles")  
      .update({ balance: newBalance })  
      .eq("id", user.id);  
      
    await loadProfile();  
  }  
}

  `).join("") : "<p class='muted'>Gözləyən çıxarış yoxdur</p>";

async function approveInvestment(id, userId, vipId, amount){  
  const nowIso = new Date().toISOString();  
    
  let updateData = {  
    status: "approved",  
    approved_at: nowIso,  
    last_profit_calc: nowIso  
  };  
  
  let { error: updateError } = await supabaseClient  
    .from("investments")  
    .update(updateData)  
    .eq("id", id);  
  
  if(updateError){  
    delete updateData.approved_at;  
    delete updateData.last_profit_calc;  
    await supabaseClient  
      .from("investments")  
      .update(updateData)  
      .eq("id", id);  
  }  
  
  await supabaseClient.from("profiles").update({ current_vip: "VIP " + vipId }).eq("id", userId);  
  
  const { data: buyerProfile } = await supabaseClient  
    .from("profiles")  
    .select("referred_by")  
    .eq("id", userId)  
    .maybeSingle();  
  
  if(buyerProfile && buyerProfile.referred_by){  
    const { data: referrer } = await supabaseClient  
      .from("profiles")  
      .select("id, bonus")  
      .eq("referral_code", buyerProfile.referred_by)  
      .maybeSingle();  
  
    if(referrer){  
      const bonusAmount = amount * REFERRAL_BONUS_PERCENTAGE;  
      const newBonus = (referrer.bonus || 0) + bonusAmount;  
      await supabaseClient  
        .from("profiles")  
        .update({ bonus: newBonus })  
        .eq("id", referrer.id);  
    }  
  }  
  
  alert("Yatırım təsdiqləndi!");  
  loadAdminData();  
}  
  
async function approveWithdrawal(id, userId, amount){  
  const { data: userProf } = await supabaseClient  
    .from("profiles")  
    .select("balance")  
    .eq("id", userId)  
    .maybeSingle();  
  
  if(userProf && (userProf.balance >= amount)){  
    const newBal = userProf.balance - amount;  
    await supabaseClient.from("profiles").update({ balance: newBal }).eq("id", userId);  
    await supabaseClient.from("withdraw_requests").update({ status: "approved" }).eq("id", id);  
    alert("Çıxarış təsdiqləndi!");  
  } else {  
    alert("İstifadəçinin balansında kifayət qədər vəsait yoxdur.");  
  }  
  loadAdminData();  
}  
  
async function logout(){  
  await supabaseClient.auth.signOut();  
  location.reload();  
}  
  
async function checkSession(){  
  const { data } = await supabaseClient.auth.getUser();  
  if(data?.user){  
    openApp(data.user);  
  }  
}  
  
checkSession();
