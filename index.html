<!DOCTYPE html>  <html lang="az" class="dark">  
<head>

  <title>Noventra - Premium İnvestisiya Platforması</title>    <!-- Tailwind CSS & Lucide Icons & Supabase JS v2 -->    <script src="https://cdn.tailwindcss.com"></script>    <script src="https://unpkg.com/lucide@latest"></script>    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>    <style>  
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');  
  
    body {  
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;  
      background-color: #030712;  
      background-image:   
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),  
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);  
      background-attachment: fixed;  
    }  
  
    /* Glassmorphism Panels */  
    .glass-panel {  
      background: rgba(15, 23, 42, 0.65);  
      backdrop-filter: blur(16px);  
      -webkit-backdrop-filter: blur(16px);  
      border: 1px solid rgba(255, 255, 255, 0.08);  
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);  
    }  
  
    .glass-header {  
      background: rgba(3, 7, 18, 0.75);  
      backdrop-filter: blur(20px);  
      -webkit-backdrop-filter: blur(20px);  
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);  
    }  
  
    .glass-footer {  
      background: rgba(3, 7, 18, 0.85);  
      backdrop-filter: blur(16px);  
    }  
  
    /* Premium VIP Cards */  
    .vip-card-glow {  
      position: relative;  
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);  
    }  
  
    .vip-card-glow:hover {  
      transform: translateY(-4px);  
      border-color: rgba(129, 140, 248, 0.4);  
      box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.3);  
    }  
  
    /* Custom Scrollbar */  
    .custom-scrollbar::-webkit-scrollbar {  
      width: 6px;  
      height: 6px;  
    }  
    .custom-scrollbar::-webkit-scrollbar-track {  
      background: rgba(15, 23, 42, 0.4);  
    }  
    .custom-scrollbar::-webkit-scrollbar-thumb {  
      background: rgba(51, 65, 85, 0.6);  
      border-radius: 4px;  
    }  
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {  
      background: rgba(99, 102, 241, 0.5);  
    }  
  
    /* Pulse Animation for Status Indicators */  
    @keyframes pulse-glow {  
      0%, 100% { opacity: 1; }  
      50% { opacity: 0.4; }  
    }  
  
    .animate-pulse-glow {  
      animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;  
    }  
  </style>  </head>  
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">    <!-- TOP HEADER / NAVBAR -->    <header class="glass-header sticky top-0 z-50 px-4 lg:px-8 py-3.5 flex justify-between items-center">  
    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">  
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/30">  
        N  
      </div>  
      <div>  
        <span class="font-black text-xl tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">  
          NOVENTRA  
        </span>  
        <span class="block text-[9px] uppercase tracking-widest text-indigo-400/80 font-semibold">Premium Platform</span>  
      </div>  
    </div>  <div id="nav-actions" class="flex items-center space-x-3">  
  <!-- Authenticated User Profile Summary or Auth Action Buttons -->  
</div>

  </header>    <!-- MAIN WRAPPER -->    <main class="flex-grow container mx-auto px-3 sm:px-6 py-6 max-w-7xl">  <!-- AUTH CONTAINER (Login & Register) -->  
<div id="auth-container" class="max-w-md mx-auto py-8 hidden">  
  <!-- Rendered dynamically -->  
</div>  

<!-- APPLICATION CONTAINER -->  
<div id="app-container" class="space-y-6 hidden">  
    
  <!-- NAVIGATION TABS -->  
  <nav id="app-tabs" class="flex space-x-2 border-b border-slate-800/80 pb-3 overflow-x-auto custom-scrollbar">  
    <!-- Rendered dynamically -->  
  </nav>  

  <!-- TAB CONTENT VIEW -->  
  <div id="tab-content" class="min-h-[600px] transition-all duration-300">  
    <!-- Dynamic Content Injected Here -->  
  </div>  
</div>

  </main>    <!-- FOOTER -->    <footer class="glass-footer py-4 px-4 border-t border-slate-800/60 text-center text-xs text-slate-400 mt-auto">  
    <div class="container mx-auto flex flex-col sm:flex-row justify-between items-center space-y-2 sm:space-y-0">  
      <p>&copy; 2026 Noventra. Bütün hüquqlar qorunur.</p>  
      <div class="flex space-x-4 text-slate-500">  
        <a href="#" class="hover:text-indigo-400 transition-colors">Məxfilik Siyasəti</a>  
        <a href="#" class="hover:text-indigo-400 transition-colors">İstifadə Şərtləri</a>  
        <a href="#" class="hover:text-indigo-400 transition-colors">Dəstək</a>  
      </div>  
    </div>  
  </footer>    <!-- Tətbiqin Məntiqi (JavaScript) -->    <script>  
    /* ==========================================================================  
       NOVENTRA PLATFORM - ENGINE & MODULES  
       ========================================================================== */  
  
    // 1. SUPABASE CLIENT CONFIGURATION  
    const SUPABASE_URL = "https://your-supabase-project.supabase.co";  
    const SUPABASE_ANON_KEY = "your-anon-key-here";  
  
    let supabase = null;  
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {  
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
    }  
  
    // 2. GLOBAL STATE MANAGEMENT  
    const state = {  
      user: null,  
      profile: null,  
      activeTab: 'dashboard',  
      adminSubTab: 'stats',  
  
      // Complete VIP Plan Configuration  
      vipPlans: [  
        { id: 1, name: 'VIP 1', price: 25, dailyProfit: 1.50, periodDays: 45 },  
        { id: 2, name: 'VIP 2', price: 35, dailyProfit: 2.30, periodDays: 50 },  
        { id: 3, name: 'VIP 3', price: 50, dailyProfit: 3.58, periodDays: 60 },  
        { id: 4, name: 'VIP 4', price: 150, dailyProfit: 11.50, periodDays: 70 },  
        { id: 5, name: 'VIP 5', price: 300, dailyProfit: 22.00, periodDays: 75 },  
        { id: 6, name: 'VIP 6', price: 450, dailyProfit: 31.50, periodDays: 80 },  
        { id: 7, name: 'VIP 7', price: 900, dailyProfit: 68.00, periodDays: 90 },  
        { id: 8, name: 'VIP 8', price: 1500, dailyProfit: 116.50, periodDays: 90 },  
        { id: 9, name: 'VIP 9', price: 3000, dailyProfit: 259.00, periodDays: 100 },  
        { id: 10, name: 'VIP 10', price: 7000, dailyProfit: 710.00, periodDays: 100 },  
        { id: 11, name: 'VIP 11', price: 15000, dailyProfit: 1870.00, periodDays: 120 }  
      ],  
  
      // Leadership Tier Specifications  
      leadershipTiers: [  
        { id: 'premium', title: 'PREMİUM RƏHBƏR', ownInvest: 50, activeRefs: 10, refInvest: 23, leaderBonus: 1.8, refBonus: 1 },  
        { id: 'supreme', title: 'SUPREME RƏHBƏR', ownInvest: 150, activeRefs: 25, refInvest: 100, leaderBonus: 5.5, refBonus: 2.5 },  
        { id: 'elite', title: 'ELİT KOMANDİR', ownInvest: 500, activeRefs: 50, refInvest: 350, leaderBonus: 18.0, refBonus: 5 },  
        { id: 'platinum', title: 'PLATİN RƏHBƏR', ownInvest: 1200, activeRefs: 100, refInvest: 1000, leaderBonus: 45.0, refBonus: 12 }  
      ],  
  
      // Dynamic Task Generator (22 Days System)  
      tasks: Array.from({ length: 22 }, (_, i) => ({  
        day: i + 1,  
        title: `Gün ${i + 1}: Finansal Analiz və Noventra İnvestisiya Tapşırığı`,  
        reward: parseFloat((1.2 + (i * 0.15)).toFixed(2)),  
        status: 'pending'  
      }))  
    };  
  
    // 3. APPLICATION LIFECYCLE INITIALIZER  
    document.addEventListener('DOMContentLoaded', () => {  
      initApp();  
    });  
  
    async function initApp() {  
      await checkSession();  
      renderNav();  
      if (window.lucide) window.lucide.createIcons();  
    }  
  
    // 4. AUTHENTICATION CONTROLLER  
    async function checkSession() {  
      if (supabase) {  
        const { data: { session } } = await supabase.auth.getSession();  
        if (session) {  
          state.user = session.user;  
          await fetchProfile(session.user.id);  
          showAppUI();  
          return;  
        }  
      }  
  
      // Fallback / Session Sync (Local Storage)  
      const stored = localStorage.getItem('noventra_user');  
      if (stored) {  
        state.user = JSON.parse(stored);  
        state.profile = state.user;  
        showAppUI();  
      } else {  
        showAuthUI('login');  
      }  
    }  
  
    async function fetchProfile(userId) {  
      if (!supabase) return;  
      const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();  
      if (!error && data) {  
        state.profile = data;  
      }  
    }  
  
    function showAuthUI(mode) {  
      document.getElementById('app-container').classList.add('hidden');  
      const container = document.getElementById('auth-container');  
      container.classList.remove('hidden');  
  
      if (mode === 'login') {  
        container.innerHTML = `  
          <div class="glass-panel p-8 rounded-3xl shadow-2xl space-y-6">  
            <div class="text-center space-y-2">  
              <h2 class="text-2xl font-black text-white">Xoş Gəldiniz</h2>  
              <p class="text-xs text-slate-400">Noventra hesabınıza daxil olun</p>  
            </div>  
            <form onsubmit="handleLoginSubmit(event)" class="space-y-4">  
              <div>  
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">E-Poç Ünvanı</label>  
                <input type="email" id="login-email" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="ad@domain.com">  
              </div>  
              <div>  
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Şifrə</label>  
                <input type="password" id="login-password" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="••••••••">  
              </div>  
              <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold text-sm rounded-2xl shadow-lg shadow-indigo-600/30 hover:opacity-95 transition-all">  
                Daxil Ol  
              </button>  
            </form>  
            <p class="text-center text-xs text-slate-400">  
              Hesabınız yoxdur? <a href="#" onclick="showAuthUI('register')" class="text-indigo-400 hover:underline font-semibold">Qeydiyyatdan keçin</a>  
            </p>  
          </div>  
        `;  
      } else {  
        container.innerHTML = `  
          <div class="glass-panel p-8 rounded-3xl shadow-2xl space-y-6">  
            <div class="text-center space-y-2">  
              <h2 class="text-2xl font-black text-white">Hesab Yaradın</h2>  
              <p class="text-xs text-slate-400">Noventra investisiya aləminə qoşulun</p>  
            </div>  
            <form onsubmit="handleRegisterSubmit(event)" class="space-y-4">  
              <div>  
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">E-Poç Ünvanı</label>  
                <input type="email" id="reg-email" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="ad@domain.com">  
              </div>  
              <div>  
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Şifrə</label>  
                <input type="password" id="reg-password" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="••••••••">  
              </div>  
              <div>  
                <label class="block text-xs font-semibold text-slate-400 mb-1.5">Referal Kodu (İstəyə bağlı)</label>  
                <input type="text" id="reg-ref" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors" placeholder="NOV1234">  
              </div>  
              <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold text-sm rounded-2xl shadow-lg shadow-indigo-600/30 hover:opacity-95 transition-all">  
                Qeydiyyatı Tamamla  
              </button>  
            </form>  
            <p class="text-center text-xs text-slate-400">  
              Artıq hesabınız var? <a href="#" onclick="showAuthUI('login')" class="text-indigo-400 hover:underline font-semibold">Daxil olun</a>  
            </p>  
          </div>  
        `;  
      }  
    }  
  
    async function handleLoginSubmit(e) {  
      e.preventDefault();  
      const email = document.getElementById('login-email').value;  
      const password = document.getElementById('login-password').value;  
  
      if (supabase) {  
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });  
        if (error) {  
          alert(`Giriş xətası: ${error.message}`);  
          return;  
        }  
        state.user = data.user;  
        await fetchProfile(data.user.id);  
      } else {  
        const isAdmin = email.includes('admin');  
        state.profile = {  
          id: 'usr_' + Math.random().toString(36).substr(2, 7),  
          email: email,  
          balance: isAdmin ? 5000.00 : 100.00,  
          vip_level: 'Pulsuz',  
          referral_code: 'NOV' + Math.floor(1000 + Math.random() * 9000),  
          is_admin: isAdmin,  
          is_blocked: false  
        };  
        localStorage.setItem('noventra_user', JSON.stringify(state.profile));  
      }  
      showAppUI();  
    }  
  
    async function handleRegisterSubmit(e) {  
      e.preventDefault();  
      const email = document.getElementById('reg-email').value;  
      const password = document.getElementById('reg-password').value;  
      const refCode = document.getElementById('reg-ref').value;  
  
      if (supabase) {  
        const { data, error } = await supabase.auth.signUp({  
          email,  
          password,  
          options: { data: { referral_code: refCode } }  
        });  
        if (error) {  
          alert(`Qeydiyyat xətası: ${error.message}`);  
          return;  
        }  
        alert(`Qeydiyyat uğurludur! E-poçtunuzu təsdiqləyin.`);  
        showAuthUI('login');  
      } else {  
        state.profile = {  
          id: 'usr_' + Math.random().toString(36).substr(2, 7),  
          email: email,  
          balance: 10.00,  
          vip_level: 'Pulsuz',  
          referral_code: 'NOV' + Math.floor(1000 + Math.random() * 9000),  
          is_admin: false,  
          is_blocked: false  
        };  
        localStorage.setItem('noventra_user', JSON.stringify(state.profile));  
        alert(`Qeydiyyat uğurla tamamlandı! 10 AZN Xoş gəldiniz bonusu hesabınıza əlavə edildi.`);  
        showAppUI();  
      }  
    }  
  
    function handleLogout() {  
      if (supabase) supabase.auth.signOut();  
      localStorage.removeItem('noventra_user');  
      state.user = null;  
      state.profile = null;  
      renderNav();  
      showAuthUI('login');  
    }  
  
    // 5. NAVIGATION & RENDERER  
    function showAppUI() {  
      document.getElementById('auth-container').classList.add('hidden');  
      document.getElementById('app-container').classList.remove('hidden');  
      renderNav();  
      renderTabs();  
      switchTab(state.activeTab);  
    }  
  
    function renderNav() {  
      const container = document.getElementById('nav-actions');  
      if (state.profile) {  
        container.innerHTML = `  
          <div class="flex items-center space-x-3">  
            <div class="text-right hidden sm:block">  
              <span class="block text-xs font-bold text-slate-200">${state.profile.email}</span>  
              <span class="block text-[10px] text-indigo-400 font-semibold">Balans: ${state.profile.balance.toFixed(2)} AZN</span>  
            </div>  
            <button onclick="handleLogout()" class="px-3 py-2 text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30 hover:bg-rose-500/30 rounded-xl transition-colors flex items-center space-x-1">  
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>  
              <span class="hidden sm:inline">Çıxış</span>  
            </button>  
          </div>  
        `;  
      } else {  
        container.innerHTML = `  
          <button onclick="showAuthUI('login')" class="px-4 py-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition-colors">Giriş</button>  
          <button onclick="showAuthUI('register')" class="px-4 py-2 text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl shadow-lg shadow-indigo-600/30 transition-colors">Qeydiyyat</button>  
        `;  
      }  
      if (window.lucide) window.lucide.createIcons();  
    }  
  
    function renderTabs() {  
      const tabsNav = document.getElementById('app-tabs');  
      let tabs = [  
        { id: 'dashboard', name: 'Ana Səhifə', icon: 'layout-dashboard' },  
        { id: 'vip', name: 'VIP Paketlər', icon: 'zap' },  
        { id: 'leadership', name: 'Liderlik Sistemi', icon: 'crown' },  
        { id: 'tasks', name: '22 Günlük Missiyalar', icon: 'calendar-check' },  
        { id: 'finance', name: 'Depozit & Çıxarış', icon: 'wallet' },  
        { id: 'referral', name: 'Referal', icon: 'share-2' },  
        { id: 'notifications', name: 'Bildirişlər', icon: 'bell' }  
      ];  
  
      if (state.profile && state.profile.is_admin) {  
        tabs.push({ id: 'admin', name: 'Admin Panel', icon: 'shield-check' });  
      }  
  
      tabsNav.innerHTML = tabs.map(tab => `  
        <button onclick="switchTab('${tab.id}')" class="flex items-center space-x-2 px-4 py-2.5 text-xs font-bold rounded-2xl whitespace-nowrap transition-all ${state.activeTab === tab.id ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'}">  
          <i data-lucide="${tab.icon}" class="w-4 h-4"></i>  
          <span>${tab.name}</span>  
        </button>  
      `).join('');  
  
      if (window.lucide) window.lucide.createIcons();  
    }  
  
    function switchTab(tabId) {  
      state.activeTab = tabId;  
      renderTabs();  
      const content = document.getElementById('tab-content');  
      content.innerHTML = '';  
  
      switch (tabId) {  
        case 'dashboard': renderDashboard(content); break;  
        case 'vip': renderVip(content); break;  
        case 'leadership': renderLeadership(content); break;  
        case 'tasks': renderTasks(content); break;  
        case 'finance': renderFinance(content); break;  
        case 'referral': renderReferral(content); break;  
        case 'notifications': renderNotifications(content); break;  
        case 'admin': renderAdmin(content); break;  
        default: renderDashboard(content);  
      }  
      if (window.lucide) window.lucide.createIcons();  
    }  
  
    // 6. DASHBOARD MODULE  
    function renderDashboard(container) {  
      container.innerHTML = `  
        <div class="space-y-6">  
          <div class="grid grid-cols-1 md:grid-cols-3 gap-5">  
            <div class="glass-panel p-6 rounded-3xl border-l-4 border-indigo-500 flex justify-between items-center">  
              <div>  
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Cari Balans</span>  
                <p class="text-3xl font-black text-white mt-1">${state.profile.balance.toFixed(2)} AZN</p>  
              </div>  
              <div class="w-12 h-12 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400">  
                <i data-lucide="wallet" class="w-6 h-6"></i>  
              </div>  
            </div>  
  
            <div class="glass-panel p-6 rounded-3xl border-l-4 border-purple-500 flex justify-between items-center">  
              <div>  
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">VIP Səviyyəsi</span>  
                <p class="text-3xl font-black text-white mt-1">${state.profile.vip_level}</p>  
              </div>  
              <div class="w-12 h-12 rounded-2xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400">  
                <i data-lucide="zap" class="w-6 h-6"></i>  
              </div>  
            </div>  
  
            <div class="glass-panel p-6 rounded-3xl border-l-4 border-emerald-500 flex justify-between items-center">  
              <div>  
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Gündəlik Nəzərdə Tutulan Qazanc</span>  
                <p class="text-3xl font-black text-emerald-400 mt-1">  
                  ${state.profile.vip_level === 'Pulsuz' ? '0.00' : '1.50'} AZN  
                </p>  
              </div>  
              <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">  
                <i data-lucide="trending-up" class="w-6 h-6"></i>  
              </div>  
            </div>  
          </div>  
  
          <div class="glass-panel p-8 rounded-3xl text-center space-y-4 relative overflow-hidden">  
            <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>  
            <h3 class="text-xl font-extrabold text-white">Gündəlik VIP Divident Toplanışı</h3>  
            <p class="text-xs text-slate-400 max-w-lg mx-auto leading-relaxed">

            </p>
