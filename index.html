<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#070b16;
 color:#fff;
 font-family:Arial,sans-serif;
}

.hidden{
 display:none!important;
}

.auth{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
}

.box,
.card{
 background:#111827;
 border:1px solid #263247;
 border-radius:22px;
 padding:25px;
}

.box{
 width:100%;
 max-width:430px;
}

.logo{
 text-align:center;
 font-size:32px;
 font-weight:900;

 color:#f6d365;
 margin-bottom:25px;
}

input,
select,
textarea{
 width:100%;
 padding:14px;

 border:1px solid #334155;
 background:#0b111d;
 color:white;
}

button{
 width:100%;
 padding:14px;

 border-radius:12px;

 font-weight:bold;
}

.main{
 background:linear-gradient(135deg,#f6d365,#fda085);
 color:#111;
 margin-top:10px;
}

.switch{
 text-align:center;
 margin-top:15px;
 color:#f6d365;
 cursor:pointer;
}

.msg{
 text-align:center;
 margin-top:12px;
 color:#ff7777;
}

#app{
 max-width:1100px;
 margin:auto;
 padding:20px;
}

.header{
 text-align:center;
}

.nav{
 display:flex;
 gap:5px;
 overflow:auto;
 margin:25px 0;
 border-bottom:1px solid #263247;
}

.nav button{
 background:none;
 color:#aaa;
 white-space:nowrap;
}

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}

.two{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
 margin-top:15px;
}

.value{
 font-size:26px;
 font-weight:bold;
 margin-top:10px;
}

.green{
 color:#40dc91;
}

.yellow{
 color:#ffd166;
}

.purple{
 color:#9d87ff;
}

.muted{
 color:#8995aa;
}

.row{
 display:flex;
 justify-content:space-between;
 padding:14px 0;
 border-bottom:1px solid #263247;
 gap:10px;
}

.info{
 background:#0b111d;
 border:1px solid #263247;
 border-radius:14px;
 padding:15px;
 margin-top:15px;
 line-height:1.6;
}

.vip-card{
 margin-top:15px;
 border:1px solid #f6d365;
 background:#111827;
}

.vip-title{
 font-size:22px;
 color:#f6d365;
 font-weight:bold;
}

.locked{
 color:#777;
}

@media(max-width:700px){
 .grid,
 .two{
  grid-template-columns:1fr;
 }
}
</style>
</head>

async function login(){


const email =
document.getElementById("loginEmail").value;


const password =
document.getElementById("loginPassword").value;



const {data,error} =
await supabaseClient.auth.signInWithPassword({

email,

password

});



if(error){

document.getElementById("loginMsg").innerText =
"Email və ya şifrə səhvdir";

return;

}



openApp(data.user);


}




async function openApp(u){

user=u;


loginPage.classList.add("hidden");

registerPage.classList.add("hidden");

app.classList.remove("hidden");



document.getElementById("email")
.innerText=user.email;



if(user.email.toLowerCase()
===ADMIN_EMAIL.toLowerCase()){


adminBtn.classList.remove("hidden");


}



await loadProfile();


page("home");


}




async function loadProfile(){


const {data}=
await supabaseClient
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();



profile=data || {};



document.getElementById("refCode")
.innerText=
profile.referral_code || "-";


document.getElementById("shareCode")
.innerText=
profile.referral_code || "-";



document.getElementById("vipStatus")
.innerText=
profile.current_vip || "Yoxdur";


}




async function withdrawRequest(){


const amount =
Number(
document.getElementById("withdrawAmount").value || 0
);



const method =
document.getElementById("withdrawMethod").value;



const info =
document.getElementById("withdrawInfo").value.trim();



const msg =
document.getElementById("withdrawMsg");



if(amount < 8){

msg.innerText =
"Minimum çıxarış 8 AZN olmalıdır";

return;

}



if(!info){

msg.innerText =
"Məlumat daxil edin";

return;

}



const {error} =
await supabaseClient
.from("withdraw_requests")
.insert({

user_id:user.id,

amount,

method,

account_info:info,

status:"pending"

});



if(error){

msg.innerText =
error.message;

return;

}



msg.innerText =
"Çıxarış sorğusu göndərildi";


}




async function logout(){


await supabaseClient.auth.signOut();

location.reload();


}




async function checkSession(){


const {data} =
await supabaseClient.auth.getUser();



if(data?.user){

openApp(data.user);

}


}



checkSession();
